spring:
  application:
    name: invoiceflow-api

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/invoiceflow}
    username: ${DB_USERNAME:invoiceflow}
    password: ${DB_PASSWORD:invoiceflow}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${PORT:8080}

app:
  jwt:
    secret: ${JWT_SECRET:dev-only-secret-change-me-in-real-deployments}
    access-token-ttl-minutes: 15
    refresh-token-ttl-days: 30

logging:
  level:
    com.invoiceflow: INFO
